<!DOCTYPE html>
<html lang="am">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ETHIO MARKET</title>
    <meta name="description" content="ETHIO MARKET – online shopping in Ethiopia. Cash on delivery, prices in Birr." />
    <meta name="theme-color" content="#0f7a4f" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet" />
    <script>
      // Dunkelmodus vor dem ersten Zeichnen setzen (kein Aufblitzen)
      try { var th = JSON.parse(localStorage.getItem("ethio.theme")); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>ETHIO MARKET needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
